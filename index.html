<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#AE0079">
<meta name="description" content="競技かるたの練習用。札分け・対戦組み合わせ・結果・履歴をまとめて管理します。">
<link rel="manifest" href="manifest.webmanifest">
<title>國大練習｜競技かるた練習管理</title>
<link rel="stylesheet" href="styles.css?v=20261002-3">
<script>(function(){try{var id=sessionStorage.getItem('kokudai-current-screen');var allowed=['screenPlayers','screenHistory','screenTournaments','screenSetup','screenPractice','screenPairing','screenStats','screenTournament','screenHowTo','screenAdminManual','screenAdminHowto','screenAdminPlayers','screenAdminTournaments','screenAdminData','screenAdminBackup','screenAdminReset','screenAdminHandover','screenAdminTrouble','screenContact'];if(allowed.indexOf(id)!==-1&&(!String(id).startsWith('screenAdmin')||sessionStorage.getItem('kokudai_admin')==='1')){var st=document.createElement('style');st.id='initial-screen-style';st.textContent='#screenHome{display:none!important}#'+id+'{display:block!important}';document.head.appendChild(st)}}catch(e){}})();</script>
</head>
<body>
<header class="app-header">
  <button id="brandHomeBtn" class="brand brand-home" type="button" aria-label="ホームへ">
    <div class="brand-mark">國大練習</div>
    <div>
      <div class="eyebrow">國學院大學かるた会</div>
      <h1>練習管理</h1>
    </div>
  </button>
  <button id="headerHistoryBtn" class="icon-btn" aria-label="履歴">履歴</button>
</header>

<main id="app">
  <section id="screenHome" class="screen active">
    <div class="page-title-row">
      <div>
        <div class="eyebrow">TODAY</div>
        <h2>今日の練習</h2>
      </div>
      <button id="newPracticeBtn" class="primary-btn">＋ 練習を作る</button>
    </div>

    <button id="homeStartBtn" class="primary-btn wide home-start-always">練習を始める</button>
    <div id="homeEmpty" class="empty-card">
      <div class="empty-icon">札</div>
      <h3>まだ練習がありません</h3>
      <p>参加者を選んで、今日の対戦を組みましょう。</p>
    </div>

    <div id="homeCurrent" class="hidden">
      <div class="practice-summary card">
        <div>
          <span class="label">日付</span>
          <strong id="homeDate"></strong>
        </div>
        <div>
          <span class="label">参加者</span>
          <strong id="homeParticipants"></strong>
        </div>
        <div>
          <span class="label">試合</span>
          <strong id="homeMatches"></strong>
        </div>
      </div>
      <div class="section-head">
        <h3>対戦</h3>
        <button id="homeAddRoundBtn" class="text-btn">＋ 次の試合</button>
      </div>
      <div id="homeMatchesList" class="stack"></div>
    </div>

    <div id="homeQuick" class="quick-grid">
      <button id="homeContactBtn" class="quick-card" type="button">
        <span class="quick-icon">✉</span>
        <span><b>お問い合わせはこちら</b><small>Microsoft Formsで送信</small></span>
      </button>
    </div>
  </section>

  
  <section id="screenSetup" class="screen">
    <div class="setup-header page-title-row">
      <div>
        <div class="eyebrow">NEW PRACTICE</div>
        <h2>練習を作る</h2>
        <p class="setup-lead">日付・札分け・参加者を設定して練習を作成します。</p>
      </div>
      <button class="text-btn back-home">ホームに戻る</button>
    </div>

    <div class="setup-grid">
      <section class="card setup-card">
        <div class="setup-card-title">
          <div><span class="setup-step">01</span><h3>基本情報</h3></div>
        </div>
        <div class="form-card-inner">
          <div class="form-field">
            <label for="practiceDate">日付</label>
            <input id="practiceDate" type="date">
          </div>
          <div class="form-field">
            <label for="practiceNote">メモ（任意）</label>
            <textarea id="practiceNote" rows="2" placeholder="例：通常練習／春合宿"></textarea>
          </div>
        </div>
      </section>
      <!-- rest of document unchanged -->
    </div>
  </section>
</main>

<nav class="bottom-nav">
  <button data-nav="screenHome" class="nav-item active"><span>🏠</span>ホーム</button>
  <button data-nav="screenPlayers" class="nav-item"><span>人</span>選手</button>
  <button data-nav="screenHistory" class="nav-item"><span>記</span>履歴</button><button data-nav="screenTournaments" class="nav-item"><span>大</span>大会</button>
  <button data-nav="screenData" class="nav-item"><span>⚙</span>設定</button>
</nav>

<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script src="supabase-config.js?v=20261002-1"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=20261003-4"></script>
<script src="extensions.js?v=20261003-9"></script>
<script src="menu-fix.js?v=20261002-8"></script>
<script src="pairing-v2.js?v=20261002-4"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
